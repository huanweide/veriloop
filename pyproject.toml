[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "veriloop"
version = "0.1.0"
description = "The self-iterating code auditor that proves its own fixes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.scripts]
veriloop = "veriloop.cli:main"

[tool.setuptools]
packages = ["veriloop", "veriloop.axes"]
