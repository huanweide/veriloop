<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: radial-gradient(1200px 600px at 20% -10%, #1b2a4a 0%, #0b1020 55%, #070a14 100%);
    color: #e8eefc;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; justify-content: center;
    padding: 72px 88px;
  }
  .eyebrow { letter-spacing: 4px; text-transform: uppercase; font-size: 20px; color: #6ea8ff; font-weight: 600; }
  h1 { font-size: 104px; font-weight: 800; line-height: 1.02; margin: 10px 0 18px; letter-spacing: -2px; }
  h1 .accent { color: #58e08a; }
  .sub { font-size: 30px; color: #c4d2ee; max-width: 1000px; line-height: 1.35; }
  .pills { margin-top: 40px; display: flex; gap: 14px; flex-wrap: wrap; }
  .pill { border: 1px solid #2f4a7a; border-radius: 999px; padding: 12px 22px; font-size: 22px; color: #aecbff; background: rgba(110,168,255,0.08); }
  .foot { margin-top: 46px; font-size: 20px; color: #7e8db0; }
</style>
</head>
<body>
  <div class="eyebrow">Self-iterating code auditor</div>
  <h1>Veri<span class="accent">Loop</span></h1>
  <div class="sub">The code auditor that <b>proves its own fixes</b> — 12 pluggable analyzers, 4 verification brakes, sandbox-verified repairs.</div>
  <div class="pills">
    <span class="pill">12 pluggable axes</span>
    <span class="pill">4 verification brakes</span>
    <span class="pill">sandbox-verified fixes</span>
    <span class="pill">zero dependencies</span>
  </div>
  <div class="foot">Stops AI self-iteration from fake-greening. MIT licensed.</div>
</body>
</html>
